<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allison Walker Ceramics</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="logo">Allison Walker Ceramics</div>
    <nav>
      <a href="/">Home</a>
      <a href="/gallery.html">Gallery</a>
      <a href="/shop.html">Shop</a>
      <a href="/custom.html">Custom Orders</a>
      <a href="/about.html">About</a>
      <a href="/cart.html">Cart <span id="cart-count" class="cart-count">0</span></a>
    </nav>
  </header>

  <div class="container">
    <h1>Bring Celebration to Everyday Life</h1>
    <p id="home-intro" style="font-size:1.2rem; margin:1rem 0; background:rgba(255,255,255,0.8); padding:1rem; border-radius:15px;"></p>

    <h2>Featured Pieces</h2>
    <div id="featured" class="card-grid"></div>
  </div>

  <footer>
    <p>Functional ceramic dinnerware with glitter & bold color • Overland Park, KS</p>
    <p><a href="mailto:Allisonwalker311@gmail.com" style="color:white;">Allisonwalker311@gmail.com</a></p>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    async function loadHome() {
      const settings = await fetch('/api/settings').then(r => r.json());
      document.getElementById('home-intro').textContent = settings.home_intro || 'Bright, bold functional ceramics.';

      const items = await fetch('/api/items?status=available').then(r => r.json());
      const featured = items.slice(0, 4);
      const container = document.getElementById('featured');
      container.innerHTML = featured.map(item => `
        <div class="card">
          <img src="${item.photos[0] ? '/media/' + item.photos[0] : '/images/placeholder.jpg'}" alt="${item.title}">
          <div class="card-body">
            <h3>${item.title}</h3>
            <p class="price">$${item.price}</p>
            <a href="/shop.html#item-${item.id}" class="btn">View</a>
          </div>
        </div>
      `).join('');
    }
    loadHome();
    updateCartCount();
  </script>
</body>
</html>
