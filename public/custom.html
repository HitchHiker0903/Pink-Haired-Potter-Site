<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Orders | The Pink Haired Potter</title>
  <meta name="description" content="Request a custom handmade mug, cup, or dinnerware set in your favorite colors.">
  <meta property="og:title" content="Custom Orders | The Pink Haired Potter">
  <meta property="og:description" content="Request a custom handmade mug, cup, or dinnerware set in your favorite colors.">
  <meta property="og:image" content="/images/work/electric-blue-cup.jpg">
  <link rel="icon" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/custom.js" defer></script>
</head>
<body>
  <header id="site-header"></header>
  <main>

    <section class="section">
      <div class="wrap">
        <div class="split" style="align-items:start">
          <div>
            <div class="eyebrow">Made just for you</div>
            <h1>Custom orders</h1>
            <div id="paid-notice"></div>
            <div class="prose" data-paras="custom_intro"></div>
            <div class="photo split-photo" style="border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:8px solid #fff;max-width:340px;margin-top:20px">
              <img src="/images/work/yellow-pink-mug.jpg" alt="Yellow mug with pink glitter resin handle" style="width:100%;aspect-ratio:1;object-fit:cover">
            </div>
          </div>
          <form class="panel" id="custom-form" novalidate>
            <div id="form-msg"></div>
            <div class="form-grid">
              <div class="field"><label for="name">Your name *</label><input type="text" id="name" name="name" required autocomplete="name"></div>
              <div class="field"><label for="email">Email *</label><input type="email" id="email" name="email" required autocomplete="email"></div>
              <div class="field"><label for="phone">Phone <span class="hint">(optional)</span></label><input type="tel" id="phone" name="phone" autocomplete="tel"></div>
              <div class="field"><label for="piece_type">Type of piece</label>
                <select id="piece_type" name="piece_type">
                  <option value="">Choose one…</option><option>Mug</option><option>Cup / tumbler</option><option>Bowl</option><option>Plate</option><option>Dinnerware set</option><option>Serving piece</option><option>Something else</option>
                </select></div>
              <div class="field"><label for="quantity">How many?</label><input type="text" id="quantity" name="quantity" placeholder="e.g. 4"></div>
              <div class="field"><label for="size">Size</label><input type="text" id="size" name="size" placeholder="e.g. 12 oz mug"></div>
              <div class="field"><label for="deadline">Needed by <span class="hint">(optional)</span></label><input type="date" id="deadline" name="deadline"></div>
              <div class="field"><label for="budget">Budget <span class="hint">(optional)</span></label><input type="text" id="budget" name="budget" placeholder="e.g. $150"></div>
            </div>
            <div class="field"><label for="colors">Colors, glitter &amp; glaze ideas</label><input type="text" id="colors" name="colors" placeholder="e.g. turquoise with orange glitter feet"></div>
            <div class="field"><label for="details">Tell me about your idea *</label><textarea id="details" name="details" required></textarea></div>
            <div class="field"><label for="photo">Reference photo <span class="hint">(optional, up to 10 MB)</span></label><input type="file" id="photo" name="photo" accept="image/*"></div>
            <div class="sr-only" aria-hidden="true"><label for="website">Leave blank</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>
            <button class="btn block" type="submit">Send my request</button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
