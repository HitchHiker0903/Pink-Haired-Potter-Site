<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Allison Walker Ceramics</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="logo">Allison Walker Ceramics</div>
    <nav>
      <a href="/">Home</a>
      <a href="/gallery.html">Gallery</a>
      <a href="/shop.html">Shop</a>
      <a href="/custom.html">Custom Orders</a>
      <a href="/about.html">About</a>
      <a href="/cart.html">Cart <span id="cart-count" class="cart-count">0</span></a>
    </nav>
  </header>
  <div class="container">
    <h1>Gallery</h1>
    <div id="gallery" class="card-grid"></div>
  </div>
  <footer></footer>
  <script src="/js/main.js"></script>
  <script>
    async function loadGallery() {
      const items = await fetch('/api/gallery').then(r => r.json());
      document.getElementById('gallery').innerHTML = items.map(g => `
        <div class="card">
          <img src="/media/${g.photo_key}" alt="${g.title || 'Pottery'}">
          <div class="card-body">
            <h3>${g.title || ''}</h3>
            <p>${g.caption || ''}</p>
            <small>${g.collection}</small>
          </div>
        </div>
      `).join('');
      updateCartCount();
    }
    loadGallery();
  </script>
</body>
</html>
