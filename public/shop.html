<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Allison Walker Ceramics</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="logo">Allison Walker Ceramics</div>
    <nav>
      <a href="/">Home</a>
      <a href="/gallery.html">Gallery</a>
      <a href="/shop.html">Shop</a>
      <a href="/custom.html">Custom Orders</a>
      <a href="/about.html">About</a>
      <a href="/cart.html">Cart <span id="cart-count" class="cart-count">0</span></a>
    </nav>
  </header>

  <div class="container">
    <h1>Shop One-of-a-Kind Pieces</h1>
    <div id="filters" style="margin:1rem 0;">
      <button class="btn" onclick="filterCategory('')">All</button>
      <button class="btn" onclick="filterCategory('mug')">Mugs</button>
      <button class="btn" onclick="filterCategory('bowl')">Bowls</button>
      <button class="btn" onclick="filterCategory('plate')">Plates</button>
      <button class="btn" onclick="filterCategory('other')">Other</button>
    </div>
    <div id="shop-items" class="card-grid"></div>
  </div>

  <footer>
    <p>All pieces are unique. Shipping calculated at checkout. Free local pickup in Overland Park, KS.</p>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    let allItems = [];
    async function loadShop() {
      allItems = await fetch('/api/items?status=available').then(r => r.json());
      renderItems(allItems);
      updateCartCount();
    }

    function renderItems(items) {
      const container = document.getElementById('shop-items');
      container.innerHTML = items.map(item => `
        <div class="card" id="item-${item.id}">
          <img src="${item.photos[0] ? '/media/' + item.photos[0] : '/images/placeholder.jpg'}" alt="${item.title}">
          <div class="card-body">
            <h3>${item.title}</h3>
            <p>${item.description || ''}</p>
            <p class="price">$${item.price}</p>
            <button class="btn btn-pink" onclick="addToCart(${item.id}, '${item.title.replace(/'/g, "\\'")}', ${item.price_cents}, ${item.weight_oz})">Add to Cart</button>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      const filtered = cat ? allItems.filter(i => i.category === cat) : allItems;
      renderItems(filtered);
    }

    loadShop();
  </script>
</body>
</html>
