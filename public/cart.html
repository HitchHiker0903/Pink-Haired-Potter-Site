<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Allison Walker Ceramics</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="logo">Allison Walker Ceramics</div>
    <nav>
      <a href="/">Home</a>
      <a href="/gallery.html">Gallery</a>
      <a href="/shop.html">Shop</a>
      <a href="/custom.html">Custom Orders</a>
      <a href="/about.html">About</a>
      <a href="/cart.html">Cart <span id="cart-count" class="cart-count">0</span></a>
    </nav>
  </header>

  <div class="container">
    <h1>Your Cart</h1>
    <div id="cart-items"></div>
    <div id="shipping-section" style="margin:1.5rem 0; background:white; padding:1rem; border-radius:15px;">
      <h3>Shipping Estimate</h3>
      <input type="text" id="zip" placeholder="Enter ZIP code" style="padding:0.5rem; border-radius:10px; border:2px solid #00ffff;">
      <button class="btn" onclick="estimateShipping()">Estimate</button>
      <p id="shipping-result"></p>
      <label><input type="radio" name="ship" value="ship" checked> Ship to me</label>
      <label><input type="radio" name="ship" value="pickup"> Free local pickup (Overland Park, KS)</label>
    </div>
    <button class="btn btn-pink" onclick="checkout()" style="font-size:1.2rem; padding:1rem 2rem;">Checkout with Stripe</button>
  </div>

  <footer></footer>
  <script src="/js/main.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-items');
      if (cart.length === 0) {
        container.innerHTML = '<p>Your cart is empty. <a href="/shop.html">Shop now!</a></p>';
        return;
      }
      container.innerHTML = cart.map(item => `
        <div style="display:flex; justify-content:space-between; background:white; padding:1rem; margin:0.5rem 0; border-radius:10px;">
          <div>
            <strong>${item.title}</strong><br>
            $${(item.price_cents / 100).toFixed(2)}
          </div>
          <button class="btn" onclick="removeFromCart(${item.id})">Remove</button>
        </div>
      `).join('');
      updateCartCount();
    }

    async function estimateShipping() {
      const zip = document.getElementById('zip').value;
      const cart = getCart();
      const res = await fetch('/api/shipping', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ zip, itemCount: cart.length })
      }).then(r => r.json());
      document.getElementById('shipping-result').textContent = res.estimate || `$${res.shipping}`;
    }

    async function checkout() {
      const cart = getCart();
      if (cart.length === 0) return alert('Cart empty');
      const shippingMethod = document.querySelector('input[name="ship"]:checked').value;
      const zip = document.getElementById('zip').value;
      // Get shipping estimate
      const shipRes = await fetch('/api/shipping', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ zip, itemCount: cart.length })
      }).then(r => r.json());

      const shipping = shippingMethod === 'pickup' ? 0 : shipRes.shipping;

      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: cart, shipping, shippingMethod })
      }).then(r => r.json());

      if (res.url) {
        window.location = res.url;
      } else {
        alert(res.error || 'Checkout failed');
      }
    }

    renderCart();
  </script>
</body>
</html>
