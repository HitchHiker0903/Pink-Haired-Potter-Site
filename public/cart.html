<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart | The Pink Haired Potter</title>
  <meta name="description" content="Your cart at The Pink Haired Potter.">
  <meta property="og:title" content="Your Cart | The Pink Haired Potter">
  <meta property="og:description" content="Your cart at The Pink Haired Potter.">
  <meta property="og:image" content="/images/work/electric-blue-cup.jpg">
  <link rel="icon" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/cart.js" defer></script>
</head>
<body>
  <header id="site-header"></header>
  <main>

    <section class="section">
      <div class="wrap">
        <h1>Your cart</h1>
        <div id="cart-notices"></div>
        <div class="cart-grid" id="cart-area">
          <div class="panel" id="cart-lines"><div class="loading">Loading your cart…</div></div>
          <aside class="panel" id="cart-summary">
            <h3>How would you like it?</h3>
            <label class="choice"><input type="radio" name="method" value="ship" checked>
              <span><strong>Ship it to me</strong><br><span class="hint">Packed with lots of padding and tracked.</span></span></label>
            <div class="field" id="zip-field" style="margin-left:4px">
              <label for="zip">Shipping ZIP code</label>
              <input type="text" id="zip" inputmode="numeric" maxlength="5" placeholder="66061" autocomplete="postal-code">
            </div>
            <label class="choice" id="pickup-choice"><input type="radio" name="method" value="pickup">
              <span><strong>Local pickup – free</strong><br><span class="hint" id="pickup-hint">Olathe, KS. Address shown after checkout.</span></span></label>
            <table class="totals">
              <tr><td>Subtotal</td><td id="t-sub">–</td></tr>
              <tr><td id="t-ship-label">Shipping</td><td id="t-ship">Enter ZIP</td></tr>
              <tr class="grand"><td>Total</td><td id="t-total">–</td></tr>
            </table>
            <p class="hint" style="margin-top:-8px">Sales tax, if any, is calculated at checkout.</p>
            <button class="btn block" id="checkout-btn" disabled>Checkout securely</button>
            <p class="hint center" style="margin:12px 0 0">Payments are processed by Stripe. Your card details never touch this site.</p>
          </aside>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
